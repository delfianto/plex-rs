[package]
name        = "plex-rs"
version     = "0.0.1"
edition     = "2024"
rust-version = "1.98.0"
authors     = ["Dwi <dwi.elfianto@accenture.com>"]
license     = "MIT"
description = "Idiomatic, fully-async Rust 2024 client for the Plex Media Server HTTP API and plex.tv (MyPlex)."
repository  = "https://github.com/justdewey/plex-rs"
homepage    = "https://github.com/justdewey/plex-rs"
documentation = "https://docs.rs/plex-rs"
readme      = "README.md"
keywords    = ["plex", "media", "api", "client", "async"]
categories  = ["api-bindings", "multimedia", "asynchronous"]
include = ["src/**/*.rs", "Cargo.toml", "LICENSE", "README.md"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "plex_rs"
path = "src/lib.rs"

[features]
default          = ["rustls"]
rustls           = []
native-tls       = ["reqwest/native-tls"]
webhook-axum     = ["dep:axum"]
discovery        = []
alerts           = ["dep:tokio-tungstenite"]
live-tests       = []

[dependencies]
axum         = { version = "0.8", optional = true, default-features = false, features = ["json", "tokio", "multipart", "http1"] }
bytes        = "1"
chrono       = { version = "0.4", default-features = false, features = ["serde", "clock"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http         = "1"
quick-xml    = { version = "0.42", features = ["serialize"] }
regex        = { version = "1", default-features = false, features = ["std", "perf"] }
reqwest      = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "gzip", "http2", "charset"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
thiserror    = "2"
tokio        = { version = "1", default-features = false, features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
tracing      = "0.1"
url          = { version = "2", features = ["serde"] }
uuid         = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
insta        = { version = "1", features = ["yaml", "json", "redactions"] }
pretty_assertions = "1"
rstest       = "0.27"
tokio        = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-test   = "0.4"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
wiremock     = "0.6"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[profile.dev]
opt-level = 0
debug     = true

[profile.release]
opt-level = 3
lto       = "thin"
codegen-units = 1
strip     = "symbols"
debug     = false

[profile.test]
opt-level = 0
debug     = true

[profile.bench]
opt-level = 3
lto       = "thin"
codegen-units = 1
