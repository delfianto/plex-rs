# cargo-deny configuration — see CLAUDE.md §4.
#
# Run locally with:
#   cargo install cargo-deny
#   cargo deny check

[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

# ----------------------------------------------------------------------------
# Advisories — fail on known RUSTSEC vulnerabilities.
# ----------------------------------------------------------------------------
[advisories]
version       = 2
yanked        = "deny"
ignore        = []

# ----------------------------------------------------------------------------
# Licenses — only permissive licenses allowed; reject copyleft.
# ----------------------------------------------------------------------------
[licenses]
version     = 2
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL", # only pulled in via the optional native-tls feature
]
# Reject GPL/AGPL family.
exceptions = []

# ----------------------------------------------------------------------------
# Bans — prevent accidental duplication / heavy alternatives.
# ----------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"
allow             = []
deny = [
    # We do not want a synchronous reqwest path in this crate.
    { name = "reqwest", wrappers = [], features = ["blocking"] },
    # OpenSSL is opt-in via the native-tls feature only.
    { name = "openssl-sys", wrappers = ["native-tls", "reqwest"] },
]
skip       = []
skip-tree  = []

# ----------------------------------------------------------------------------
# Sources — only crates.io and well-known git hosts.
# ----------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
